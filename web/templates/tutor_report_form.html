<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            primary: '#5645d4', 'primary-pressed': '#4534b3',
            navy: '#0a1530', canvas: '#ffffff', surface: '#f6f5f4',
            hairline: '#e5e3df', 'hairline-soft': '#ede9e4', 'hairline-strong': '#c8c4be',
            ink: '#1a1a1a', charcoal: '#37352f', steel: '#787671', stone: '#a4a097',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script defer src="/static/js/app.js"></script>
</head>
<body class="font-sans bg-surface">
<div class="flex h-screen overflow-hidden">
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 opacity-0 pointer-events-none lg:hidden"></div>
  <aside id="sidebar-drawer" class="drawer-closed fixed top-0 left-0 h-full w-64 bg-navy z-30 flex flex-col flex-shrink-0 lg:static lg:translate-x-0 lg:z-auto">
    <div class="px-5 py-5 border-b border-white/10"><span class="text-white font-bold text-lg tracking-tight">Kala Belajar</span></div>
    <nav class="flex-1 px-3 py-4 flex flex-col gap-0.5 overflow-y-auto">
      <a href="/dashboard" class="flex items-center gap-3 px-3 py-2 rounded-lg text-white/60 hover:text-white hover:bg-white/10 text-sm font-medium transition-colors"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/tutor/schedules" class="flex items-center gap-3 px-3 py-2 rounded-lg text-white/60 hover:text-white hover:bg-white/10 text-sm font-medium transition-colors"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Jadwal Saya</a>
      <a href="/tutor/sessions" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-white/10 text-white text-sm font-medium"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Riwayat Mengajar</a>
      <a href="/tutor/report/create" class="flex items-center gap-3 px-3 py-2 rounded-lg text-white/60 hover:text-white hover:bg-white/10 text-sm font-medium transition-colors"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Buat Laporan</a>
    </nav>
    <div class="px-3 py-4 border-t border-white/10">
      <form method="post" action="/logout">
        <button type="submit" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-white/60 hover:text-white hover:bg-white/10 text-sm font-medium transition-colors text-left">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Keluar
        </button>
      </form>
    </div>
  </aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-hairline flex items-center px-4 lg:px-6 gap-4 flex-shrink-0">
      <button id="sidebar-toggle" class="lg:hidden p-2 rounded-lg hover:bg-surface text-charcoal transition-colors"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="flex-1 min-w-0 flex items-center gap-3">
        <a href="/tutor/sessions" class="p-1.5 rounded-lg hover:bg-surface text-steel transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </a>
        <div>
          <p class="text-xs font-semibold text-primary uppercase tracking-wider">Tutor</p>
          <h1 class="text-lg font-semibold text-ink leading-tight">Isi Laporan</h1>
        </div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-4 lg:p-8">
      <!-- Session context -->
      <div class="bg-[#e6e0f5] rounded-xl px-5 py-3 mb-6 text-sm text-[#391c57]">
        <strong>{{ .Session.Student.Name }}</strong> · {{ .Session.DateLabel }} · {{ .Session.TimeLabel }}
      </div>

      {{ if .Error }}
      <div class="bg-[#fde0ec] text-[#a02e6d] text-sm font-medium rounded-lg px-4 py-3 mb-6">{{ .Error }}</div>
      {{ end }}

      <div class="bg-white rounded-xl border border-hairline p-6">
        <form id="report-form" class="flex flex-col gap-5" method="post" action="/tutor/sessions/{{ .Session.ID }}/report">
          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-semibold text-steel uppercase tracking-wider">Status Sesi</span>
            <select id="report-status" name="status" required
              class="h-9 px-3 rounded-lg border border-hairline-strong bg-white text-sm text-ink focus:border-primary outline-none">
              <option value="completed">Selesai</option>
              <option value="canceled">Dibatalkan</option>
              <option value="student_absent">Murid Tidak Hadir</option>
              <option value="follow_up_required">Perlu Tindak Lanjut</option>
              <option value="rescheduled">Dijadwalkan Ulang</option>
              <option value="scheduled">Terjadwal</option>
            </select>
          </label>

          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-semibold text-steel uppercase tracking-wider">Materi yang dibahas <span class="text-[#e03131]">*</span></span>
            <textarea id="report-material" name="material_summary" rows="5" placeholder="Contoh: Pecahan campuran dan latihan soal..." required
              class="px-3 py-2.5 rounded-lg border border-hairline-strong bg-white text-sm text-ink focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none resize-none">{{ if .Session.Report }}{{ .Session.Report.MaterialSummary }}{{ end }}</textarea>
          </label>

          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-semibold text-steel uppercase tracking-wider">Progres murid</span>
            <textarea id="report-progress" name="progress_summary" rows="4"
              class="px-3 py-2.5 rounded-lg border border-hairline-strong bg-white text-sm text-ink focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none resize-none">{{ if and .Session.Report .Session.Report.ProgressSummary }}{{ .Session.Report.ProgressSummary }}{{ end }}</textarea>
          </label>

          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-semibold text-steel uppercase tracking-wider">PR / Tugas</span>
            <textarea id="report-homework" name="homework" rows="3"
              class="px-3 py-2.5 rounded-lg border border-hairline-strong bg-white text-sm text-ink focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none resize-none">{{ if and .Session.Report .Session.Report.Homework }}{{ .Session.Report.Homework }}{{ end }}</textarea>
          </label>

          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-semibold text-steel uppercase tracking-wider">Catatan kendala</span>
            <textarea id="report-issues" name="issue_notes" rows="3"
              class="px-3 py-2.5 rounded-lg border border-hairline-strong bg-white text-sm text-ink focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none resize-none">{{ if and .Session.Report .Session.Report.IssueNotes }}{{ .Session.Report.IssueNotes }}{{ end }}</textarea>
          </label>

          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-semibold text-steel uppercase tracking-wider">Saran latihan di rumah</span>
            <textarea id="report-practice" name="home_practice_suggestion" rows="3"
              class="px-3 py-2.5 rounded-lg border border-hairline-strong bg-white text-sm text-ink focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none resize-none">{{ if and .Session.Report .Session.Report.HomePracticeSuggestion }}{{ .Session.Report.HomePracticeSuggestion }}{{ end }}</textarea>
          </label>

          <label class="flex items-center gap-3 cursor-pointer">
            <input id="report-publish" type="checkbox" name="publish" checked class="w-4 h-4 rounded border-hairline-strong accent-primary cursor-pointer">
            <span class="text-sm text-charcoal">Terbitkan untuk Parent</span>
          </label>

          <div class="pt-2 border-t border-hairline-soft">
            <button id="report-submit" type="submit"
              class="px-6 py-2.5 rounded-lg bg-primary text-white text-sm font-medium hover:bg-primary-pressed transition-colors">
              Kirim Laporan
            </button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
</body>
</html>
